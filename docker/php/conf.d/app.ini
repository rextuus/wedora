; Große Uploads kommen in Stücken (fortsetzbar), nie als ein einzelner Request.
; Die PHP-Grenzen sind deshalb bewusst klein; fachliche Limits prüft die Anwendung (ADR 0003).
upload_max_filesize = 25M
post_max_size = 26M
memory_limit = 256M
max_execution_time = 30
expose_php = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
