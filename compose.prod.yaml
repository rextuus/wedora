# Wedora – Produktion auf einem einzelnen Server.
# Aufruf: docker compose -f compose.prod.yaml --env-file .env.prod.local …  (siehe docs/deployment.md)
# Secrets kommen ausschließlich aus .env.prod.local (Vorlage: .env.prod.dist).
name: wedora

# Docker-Logs begrenzen (sonst wachsen sie unbegrenzt): je Dienst höchstens 5 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: wedora-app:prod
  restart: unless-stopped
  logging: *logging
  volumes:
    - media_data:/srv/media:rw
  environment:
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env.prod.local}
    DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI fehlt in .env.prod.local}
    DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.4.11&charset=utf8mb4
    MEDIA_ROOT: /srv/media
    MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?MEDIA_TOKEN_SECRET fehlt}
    IMGPROXY_KEY: ${IMGPROXY_KEY:?IMGPROXY_KEY fehlt}
    IMGPROXY_SALT: ${IMGPROXY_SALT:?IMGPROXY_SALT fehlt}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-50}
    GEMINI_MONTHLY_LIMIT: ${GEMINI_MONTHLY_LIMIT:-300}
  depends_on:
    database:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=192M"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: wedora-web:prod
    restart: unless-stopped
    logging: *logging
    environment:
      # Nur HTTP: HTTPS und Zertifikat macht der Caddy auf dem VPS, der über WireGuard hierher weiterleitet.
      SERVER_NAME: ":80"
      # Nur von diesen Adressen gelten X-Forwarded-* (Gast-IP, https): die WireGuard-IP des VPS.
      REVERSE_PROXY_IPS: ${REVERSE_PROXY_IPS:-private_ranges}
    volumes:
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # Ein einziger Port nach außen; am besten nur auf der WireGuard-Adresse dieses Rechners (HTTP_BIND).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8190}:80"
    depends_on:
      - app
      - imgproxy

  database:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.18
    restart: unless-stopped
    logging: *logging
    # Liest den Medienspeicher mit der Gruppe www-data (GID 82 im Alpine-PHP-Image), nur lesend.
    user: "999:82"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?IMGPROXY_KEY fehlt}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?IMGPROXY_SALT fehlt}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /media
      IMGPROXY_ALLOWED_SOURCES: local:///
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "52428800"
      IMGPROXY_WORKERS: "2"
      IMGPROXY_STRIP_METADATA: "true"
      IMGPROXY_AUTO_ROTATE: "true"
    volumes:
      - media_data:/media:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

volumes:
  database_data:
  media_data:
  caddy_data:
  caddy_config:
